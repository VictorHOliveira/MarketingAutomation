name: Marketing Automation

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Projeto (qa_overflow, scandoc, supertarefas, qa_picker)'
        required: false
        default: 'qa_overflow'
      dry_run:
        description: 'Simular sem publicar (true/false)'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.12'

jobs:
  publish-devto:
    name: Publicar no Dev.to
    runs-on: ubuntu-latest
    if: inputs.dry_run != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install requests

      - name: Publish to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python publish_devto.py output/${{ inputs.project }}*_all_content.json

  publish-linkedin:
    name: Publicar no LinkedIn
    runs-on: ubuntu-latest
    if: inputs.dry_run != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install requests

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python publish_linkedin.py output/${{ inputs.project }}*_all_content.json

  summary:
    name: Resumo
    needs: [publish-devto, publish-linkedin]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Resultado da Automacao de Marketing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Canal | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dev.to | ${{ needs.publish-devto.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LinkedIn | ${{ needs.publish-linkedin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Projeto: **${{ inputs.project }}**" >> $GITHUB_STEP_SUMMARY
          echo "Dry Run: **${{ inputs.dry_run }}**" >> $GITHUB_STEP_SUMMARY
          echo "Executado em: $(date)" >> $GITHUB_STEP_SUMMARY
